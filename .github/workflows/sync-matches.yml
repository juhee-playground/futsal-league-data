name: Sync Match Records

on:
  schedule:
    # 매주 월요일 18:00 KST (UTC 09:00) — 주말 경기 기록지 반영
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install sync dependencies
        working-directory: scripts/sync-matches
        run: npm install

      - name: Crawl past SCHEDULED matches
        working-directory: scripts/sync-matches
        run: |
          node sync-matches.js fk1 --write
          node sync-matches.js fk2 --write

      - name: Validate
        run: node scripts/validation/validate-all.mjs

      - name: Commit and push if changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/masters/players.json \
            data/seasons/*/player_registrations.json \
            data/seasons/*/division/*/matches.json
          git commit -m "$(cat <<'EOF'
          chore: 주간 경기 기록 자동 동기화

          EOF
          )"
          git push origin develop
